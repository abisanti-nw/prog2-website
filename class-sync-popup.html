<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Class Blocks</title>
    <link rel="stylesheet" href="class-sync-popup.css">
</head>
<body>
    <div class = "popup">
        <h2> Assign Class to Blocks: </h2>
        <form id="class-form">
            <label for = "classes"> Class: </Label>
            <select name = "classes" id = "classes">
                <optgroup id="classes-group" label = "Classes"></optgroup>
            </select>
            
            <label for = "blocks">Block: </label>
            <select name = "blocks" id = "blocks">
                <optgroup label = "Blocks">
                    <option value = "a-block">Block A</option>
                    <option value = "b-block">Block B</option>
                    <option value = "c-block">Block C</option>
                    <option value = "d-block">Block D</option>
                    <option value = "e-block">Block E</option>
                    <option value = "f-block">Block F</option>
                    <option value = "g-block">Block G</option>
                    <option value = "h-hlock">Block H</option>
                </optgroup>
            </select>
            <button id="class-form-submit" type="submit">Submit</button>
        </form>
        
    </div>
</body>
<script src="class-sync-popup.js" defer></script>
</html>
