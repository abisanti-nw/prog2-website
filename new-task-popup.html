<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Class Blocks</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class = "task-form-container">
        <form id="task-form">
            <label for = "name">Name:</label>
            <input type="text" id = 'task-name' name = 'task-name'><br>

            <label for = "description">Enter task description:</label>
            <input type="text" id = 'task-description' name = 'task-description'><br>
            
            <label for = "start-time">Start:</Label>
            <input type = "text" id = "start-time" name = "start-time"><br>

            <label for = "end-time">End:</Label>
            <input type = "text" id = "end-time" name = "end-time"><br>

            <button id="task-form-submit" type="submit">Submit</button>
        </form>
    </div>
</body>
<script src="new-task-popup.js" defer></script>
</html>
